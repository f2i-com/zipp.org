[package]
name = "zipp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zipp command-line interface: `zipp js <file.js>`"

[[bin]]
name = "zipp"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
zipp-vm = { path = "../zipp-vm" }

[features]
default = []
regex-linear = ["zipp-vm/regex-linear"]
