[package]
name = "zipp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zipp command-line interface: `zipp js <file.js>`"

[[bin]]
name = "zipp"
path = "src/main.rs"

[dependencies]
# Enable mimalloc's hardened mode (guarded metadata, stronger randomization and
# integrity checks). The native runner is defense in depth rather than the
# primary hostile-code boundary, but allocator hardening raises the cost of
# exploiting a memory-corruption defect in that process.
mimalloc = { version = "0.1.52", default-features = false, features = ["secure"] }
# The CLI's explicit `sandbox` command uses the VM's instruction/heap meter.
# Ordinary `zipp js` does not attach a recorder, preserving its semantics; the
# feature contributes one predictable null check to interpreted dispatch.
zipp-vm = { path = "../zipp-vm", features = ["instrument"] }

[features]
default = []
regex-linear = ["zipp-vm/regex-linear"]
