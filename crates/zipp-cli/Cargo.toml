[package]
name = "zipp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZIPP command-line interface: `zipp run [--prove] file.zipp`"

[[bin]]
name = "zipp"
path = "src/main.rs"

# The zk-STARK proving profile, the Cranelift JIT, and the LLVM release tier are
# all OPTIONAL (on by default). `--no-default-features` drops the heavy deps
# (Winterfell, Cranelift); the LLVM tier itself has no build-time dependency
# (it shells out to clang), so it's cheap to keep.
[features]
default = ["zk", "jit", "llvm"]
zk = ["dep:zipp-zk"]
jit = ["dep:zipp-jit"]
llvm = ["dep:zipp-llvm"]

[dependencies]
zippc = { path = "../zippc" }
zipp-zk = { path = "../zipp-zk", optional = true }
zipp-jit = { path = "../zipp-jit", optional = true }
zipp-llvm = { path = "../zipp-llvm", optional = true }
