[package]
name = "zipp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZIPP command-line interface: `zipp run [--prove] file.zipp`"

[[bin]]
name = "zipp"
path = "src/main.rs"

# The zk-STARK proving profile and the native JIT are OPTIONAL (on by default).
# `--no-default-features` drops both heavy dependencies (Winterfell, Cranelift).
[features]
default = ["zk", "jit"]
zk = ["dep:zipp-zk"]
jit = ["dep:zipp-jit"]

[dependencies]
zippc = { path = "../zippc" }
zipp-zk = { path = "../zipp-zk", optional = true }
zipp-jit = { path = "../zipp-jit", optional = true }
