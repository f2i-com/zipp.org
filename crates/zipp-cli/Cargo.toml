[package]
name = "zipp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zipp command-line interface: `zipp js <file.js>`"

[[bin]]
name = "zipp"
path = "src/main.rs"

[dependencies]
# The ordinary JIT CLI is the maximum-throughput profile for trusted scripts.
# Untrusted code belongs in the separately resolved zipp-sandbox workspace,
# which enables mimalloc/secure and excludes unsafe/JIT engine features. Keep an
# opt-in hardened allocator here for deployments that accept its measured cost.
mimalloc = { version = "0.1.52", default-features = false }
serde_json = "1.0"
# The CLI's explicit `sandbox` command uses the VM's instruction/heap meter.
# Ordinary `zipp js` does not attach a recorder, preserving its semantics; the
# feature contributes one predictable null check to interpreted dispatch.
zipp-vm = { path = "../zipp-vm", features = ["instrument"] }
# Native GPU execution of a Python program's torch.compile / zipp_gpu graphs
# (feature `gpu`): gpu-lab's runtime over wgpu. Only this trusted CLI links
# it; zipp-sandbox and zipp-wasm are separate workspaces and never do.
zipp-gpu = { path = "../zipp-gpu", optional = true }

[features]
# The experimental Python-subset frontend (`zipp py file.py`, `zipp run`,
# `--lang=python`). Default-on for the CLI only; `--no-default-features`
# yields the JavaScript-only binary.
default = ["python", "gpu"]
python = ["zipp-vm/python"]
# Run `zipp py` graphs on a hardware GPU (Vulkan, Direct3D 12 or Metal,
# loaded at run time) when one is present, synchronously, exactly where the
# CPU evaluator would have run them; the CPU evaluator otherwise.
gpu = ["python", "dep:zipp-gpu", "zipp-vm/python-native-gpu"]
python-js-interop = ["python", "zipp-vm/python-js-interop"]
secure-allocator = ["mimalloc/secure"]
regex-linear = ["zipp-vm/regex-linear"]

[build-dependencies]
sha2 = "0.11.0"

[dev-dependencies]
# `tests/build_source_identity.rs` includes the build-script helper directly so
# the provenance framing and fail-closed behavior are exercised by `cargo test`.
sha2 = "0.11.0"
