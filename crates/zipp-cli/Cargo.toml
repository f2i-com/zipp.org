[package]
name = "zipp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zipp command-line interface: `zipp js <file.js>`"

[[bin]]
name = "zipp"
path = "src/main.rs"

[dependencies]
# The ordinary JIT CLI is the maximum-throughput profile for trusted scripts.
# Untrusted code belongs in the separately resolved zipp-sandbox workspace,
# which enables mimalloc/secure and excludes unsafe/JIT engine features. Keep an
# opt-in hardened allocator here for deployments that accept its measured cost.
mimalloc = { version = "0.1.52", default-features = false }
# The CLI's explicit `sandbox` command uses the VM's instruction/heap meter.
# Ordinary `zipp js` does not attach a recorder, preserving its semantics; the
# feature contributes one predictable null check to interpreted dispatch.
zipp-vm = { path = "../zipp-vm", features = ["instrument"] }

[features]
default = []
secure-allocator = ["mimalloc/secure"]
regex-linear = ["zipp-vm/regex-linear"]

[build-dependencies]
sha2 = "0.11.0"

[dev-dependencies]
# `tests/build_source_identity.rs` includes the build-script helper directly so
# the provenance framing and fail-closed behavior are exercised by `cargo test`.
sha2 = "0.11.0"
