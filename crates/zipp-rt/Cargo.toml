[package]
name = "zipp-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZIPP shared native runtime — allocator + conservative GC + print/string helpers (rlib for the JIT, staticlib for the LLVM tier)"

# rlib: the JIT (zipp-jit) depends on this and registers the fns as JIT symbols.
# staticlib: the LLVM tier links the .lib into the clang-compiled exe.
[lib]
crate-type = ["rlib", "staticlib"]
