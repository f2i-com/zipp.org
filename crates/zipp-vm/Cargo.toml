[package]
name = "zipp-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZIPP dynamic JavaScript engine v2 — explicit-frame register VM with a NaN-boxed value model, designed from the ground up so a JIT can keep unboxed values in registers across call boundaries (the property V8 wins on)."

[dependencies]
rustc-hash = { workspace = true }
# The regex engine. A DIRECT path dependency on our fork rather than a
# crates.io version rewritten by `[patch.crates-io]`: zipp-vm calls
# `Regex::from_unicode_byteopt`, which exists only in the fork, so the upstream
# crate does not even compile against this code. See crates/regress-fork/FORK.md.
# `utf16`: find_from_utf16/find_from_ucs2 — regex execution directly over
# UTF-16 code units (ES semantics; ranges/positions are unit indices).
regress = { package = "zipp-regress", path = "../regress-fork", features = ["utf16"] }
unicode-normalization = "0.1"
# Arbitrary-precision BigInt (pure Rust). The common path stays `i128`
# (`HeapObj::BigInt`); `num-bigint` only backs values outside i128 range
# (`HeapObj::BigIntBig`) — see vm/bigint.rs for the canonical-form invariant.
num-bigint = "0.4"
num-traits = "0.2"
dynasm = { workspace = true, optional = true }
dynasmrt = { workspace = true, optional = true }

[features]
# Native x86-64 JIT tier (dynasm). On by default on supported targets; the
# `codegen` module is `#[cfg(feature = "jit")]` so a `--no-default-features`
# build is a pure interpreter with no unsafe codegen.
default = ["jit"]
jit = ["dep:dynasm", "dep:dynasmrt"]
