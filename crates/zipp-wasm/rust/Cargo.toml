# The Graph v2 compute kernels, as WebAssembly.
#
# One crate, in its own feature-resolution domain for the reason the root
# workspace excludes this tree: `zipp-kernels` is `no_std` with
# `panic = "abort"` and its own profile, and unifying features between a
# freestanding SIMD kernel module and the engine embedding would mean neither
# gets the settings it was measured with.
#
# Reading GGUF used to live here too. It does not any more: the container, the
# block formats and the tokenizer are generic, useful without ZIPP, and now
# live in their own repository -- https://github.com/f2i-com/gguf-wasm. ZIPP
# consumes that project rather than owning it. See ../model-plugins/interop/
# GGUF.md for where the boundary is and why it is there.
#
# What remains here is the part that is only meaningful inside ZIPP: kernels
# held to bit-for-bit agreement with a JavaScript reference, over a compute
# protocol this repository defines.
[workspace]
resolver = "2"
members = ["zipp-kernels"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The block decoders, from the GGUF project. A matmul that reads a quantized
# weight has to decode it exactly as the reader does, so it uses that code
# rather than a copy of it.
#
# Pinned by revision, not by tag: a tag is a name and a name can be moved, a
# revision is the code. This one is gguf-wasm v0.0.1, and it is the same
# revision ../model-plugins/wasm/gguf-wasm.lock.json records for the
# WebAssembly build in the tree. Move both together.
gguf-quants = { package = "f2i-gguf-quants", git = "https://github.com/f2i-com/gguf-wasm", rev = "91b198f4eb062c2129f03ba6231ff00ff1271236" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
