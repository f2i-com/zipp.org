<!doctype html>
<meta charset="utf-8">
<title>ZIPP in a page</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
  textarea { width: 100%; height: 10rem; font: 14px ui-monospace, monospace; }
  pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; min-height: 3rem; }
</style>
<h1>ZIPP {{VERSION}} in a page</h1>
<p>Each run gets a fresh sandbox in its own Worker: nothing is permitted, and a program that runs longer than two seconds is stopped.</p>
<textarea id="code">const squares = [1, 2, 3, 4].map(n => n * n);
console.log("squares:", squares.join(", "));
console.log(new Intl.NumberFormat("en-US").format(1234567.891));</textarea>
<p><button id="run" disabled>Loading…</button></p>
<pre id="out"></pre>
<script type="module">
  import { loadZipp } from "../zipp.mjs";

  const out = document.getElementById("out");
  const button = document.getElementById("run");
  const zipp = await loadZipp(new URL("../zipp-{{VERSION}}-javascript.wasm", import.meta.url));
  button.textContent = `Run (ZIPP ${zipp.meta.version}, ${zipp.meta.variant})`;
  button.disabled = false;
  button.onclick = async () => {
    button.disabled = true;
    const sandbox = await zipp.createSandbox({ limits: { timeoutMs: 2000 } });
    try {
      out.textContent = (await sandbox.run(document.getElementById("code").value)).output.join("\n");
    } catch (error) {
      out.textContent = [...error.output, `${error.category}: ${error.message}`].join("\n");
    } finally {
      await sandbox.close();
      button.disabled = false;
    }
  };
  window.zippExample = { ready: true };
</script>
