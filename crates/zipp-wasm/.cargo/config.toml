[target.wasm32-unknown-unknown]
# The VM rejects guest growth at its lower 512 MiB accounting limit
# (`MAX_APPROX_HEAP_BYTES` in src/lib.rs). Keep an independent WebAssembly
# maximum ABOVE that as the allocator/compiler backstop: even a missed
# accounting path or hostile source shape cannot grow this instance's linear
# memory without bound, while the accounting limit still fires first and
# surfaces as a catchable `RangeError` rather than a trap. Run each tenant in a
# dedicated Worker so a trap or deadline can discard the complete instance.
rustflags = [
    "-C", "link-arg=--max-memory=1073741824",
    "-C", "link-arg=-zstack-size=1048576",
]
