[package]
name = "zipp-wasm"
version = "0.0.13"
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly embedding of the zipp JavaScript engine: a persistent VM a browser host can keep alive across re-entries."

# Keep this package in a separate feature-resolution domain from the native
# workspace. See the root workspace's `exclude` rationale.
[workspace]
resolver = "2"

[profile.release]
# Integer-wrap bugs in VM bookkeeping should terminate the disposable Worker,
# never silently become an index/limit bypass in the hardened artifact.
overflow-checks = true
panic = "abort"
# MEASURED 2026-09-05 on tests/node/bench.cjs, the artifact post-processed as
# shipped (wasm-opt -O3): fat LTO with one codegen unit runs the integer
# arithmetic workloads 18-22% faster (arith-int 9.87 -> 7.67 ms, arith-mod
# 12.44 -> 10.17) and is 280 KB smaller, for ~45 s more build time. The
# interpreter's hot path spans zipp-vm, the regress fork and the allocator, so
# cross-crate inlining is what pays; wasm-opt alone did not recover it. The
# earlier codegen-units measurement (four units 1.8% smaller than one, no
# throughput change) was made without LTO.
#
# Also measured: turning `overflow-checks` off on top of LTO gains nothing
# the bench can see (arith-int 8.01 vs 7.67, within noise), so the hardening
# stays.
lto = "fat"
codegen-units = 1

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, interpreter-only: the JIT tiers emit x86-64/ARM64 native code and
# have no meaning on wasm (see zipp-vm's `jit` feature).
zipp-vm = { path = "../zipp-vm", default-features = false, features = ["safe-sandbox", "meter-only", "wasm-no-fs-loader", "wasm-single-agent"] }
wasm-bindgen = "=0.2.126"
# Keep the Function type/call bindings, but do not compile js-sys's
# `unsafe-eval` constructors into the trusted host surface.
js-sys = { version = "=0.3.103", default-features = false, features = ["std"] }
console_error_panic_hook = "=0.1.7"
