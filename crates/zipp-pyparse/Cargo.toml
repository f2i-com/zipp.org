[package]
name = "zipp-pyparse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZIPP's Python front end: a byte-oriented lexer, an arena AST and a recursive-descent parser for Python 3.13 syntax."

[dependencies]
rustc-hash = { workspace = true }
# XID_Start / XID_Continue, the same tables the RustPython-compatible lexer used.
unicode-ident = "=1.0.24"
# Emoji_Presentation: a lone emoji is an identifier (RustPython's extension, kept).
unicode-properties = { version = "=0.1.4", default-features = false, features = ["emoji"] }
# The converter to the RustPython AST the emitter still consumes (see `rustpython`).
rustpython-ast = { version = "=0.4.0", optional = true, default-features = false, features = ["location", "num-bigint"] }
num-bigint = { version = "0.4.3", optional = true }

[features]
# `rustpython::to_rustpython`: the arena AST as `rustpython_ast` nodes, equal to
# what `crates/rustpython-parser-fork` builds (see README.md).
rustpython = ["dep:rustpython-ast", "dep:num-bigint"]

[dev-dependencies]
# The reference the differential tests compare against.
rustpython-parser = { path = "../rustpython-parser-fork", version = "=0.4.0", default-features = false, features = ["num-bigint", "location"] }

[[test]]
name = "differential"
required-features = ["rustpython"]
