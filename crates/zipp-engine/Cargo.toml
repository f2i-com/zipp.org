[package]
name = "zipp-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sandboxed JavaScript-subset bytecode VM with x86-64/AArch64 JIT backend."
readme = "../../README.md"
keywords = ["vm", "jit", "javascript", "sandbox", "scripting"]
categories = ["compilers", "wasm"]

[lib]
bench = false

[features]
# `djit` is no longer in `default` because it currently `compile_error!`s
# on x86-64 Linux/macOS (the helpers use the `extern "win64"` ABI). With
# `djit` defaulted-on, a plain `cargo build` failed for any embedder
# outside Windows + AArch64. Crates that always want the JIT
# (zipp-bench, zipp-cli) opt in explicitly via
# `features = ["djit"]`. Embedders running untrusted scripts that need
# strict sandboxing can leave it off and stay on the interpreter.
default = []

# Reserved for zero-knowledge execution traces (riscv32 target).
zkvm = []

# dynasm JIT — production backend. Single-pass, deterministic, instant.
# Currently restricted to x86-64 Windows and AArch64 (any OS); enabling
# on x86-64 Linux/macOS triggers a compile_error directing the embedder
# to either drop the feature or port the helper ABI to System V.
djit = ["dep:dynasm", "dep:dynasmrt"]

[dependencies]
indexmap = { workspace = true }
itoa = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
ryu = { workspace = true }
serde_json = { workspace = true }

# JIT backend — optional, pulled in by the `djit` feature.
dynasm = { workspace = true, optional = true }
dynasmrt = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
