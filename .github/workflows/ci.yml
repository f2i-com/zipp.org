# Manual verification gate while automatic CI is paused (2026-09-12). The only
# triggers below are `workflow_dispatch` and `workflow_call`: nothing here runs
# on a push or a pull request, so a change CAN land on `main` without it. This
# gate fires when someone dispatches it and whenever release.yml calls it.
# Restore the push/main and pull_request triggers — and this comment's merge
# wording — when automatic checks resume.
#
# The retained verification jobs are deliberately small, so a dispatched run
# catches a broken default-semantics regression while the runner stays cheap:
#
#   python   the Python-enabled VM and CLI, the browser artifact, the portable
#            GPU contracts, and the local-model plugins against that artifact
#            (their full-checkout gates required rather than skipped, plus the
#            GGUF module's lock file and the Rust pin that must match it);
#   engine   the VM's unit tests plus the audit-day regression binaries, on
#            the default profile, and the manifest-advertised feature builds;
#   wasm     the isolated host workspace, the production wasm32 build, and the
#            Node boundary suite against that exact artifact;
#   landing  the public site's tests, typecheck and production build, plus the
#            playground copy it synchronises out of crates/zipp-wasm.
#
# Everything heavier is a LOCAL command (see HANDOFF.md "Local verification"):
# the full 230-binary engine suite, the safe-profile and instrumented lanes,
# test262, the three-browser Worker smoke, the density and benchmark
# harnesses. security.yml runs the broader matrix on demand.
#
# Also a REUSABLE workflow: release.yml calls it with the exact tagged
# revision, so publishing depends on this same gate at that revision rather
# than on whatever `main` build last happened to be green (ZIPP-09).
#
# Every job runs with a read-only token and no secrets; when pull-request
# triggers are restored, fork runs get exactly that and nothing here needs more.
name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The exact revision to check out (release.yml passes the tagged commit)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Only release.yml passes `ref` (this workflow's own dispatch takes no
  # inputs), so a release's gate run keeps its per-revision group and is never
  # cancelled by a newer dispatch. `github.event_name` CANNOT express that: in
  # a called workflow the github context is the CALLER's, so it reads `push` or
  # `workflow_dispatch` and never `workflow_call`.
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_CLI: "0.2.126"

jobs:
  python:
    name: Python frontend, project files and GPU contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Install Rust and wasm32 target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.92.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the Python-enabled VM and CLI (including filesystem policy)
        run: |
          cargo +1.92.0 test --locked -p zipp-vm --features python --test python_frontend --test python_project --test python_corpus --test python_torch --test python_javascript --test python_torch_core --test python_torch_nn --test python_torch_optim --test python_torch_gpu --test python_torch_native --test python_torch_gpu2 --test python_torch_nn2 --test python_torch_dtypes --test python_torch_linalg --test python_torch_distributions --test python_torch_amp --test python_torch_nn3 --test python_torch_gpu3 --test python_torch_complex --test python_torch_fft --test python_torch_sparse --test python_torch_quant --test python_torch_distributed
          cargo +1.92.0 test --locked -p zipp-vm --features python-js-interop --test python_javascript
          cargo +1.92.0 test --locked -p zipp-vm --features python --lib minify_check
          cargo +1.92.0 test --locked -p zipp-cli
          cargo +1.92.0 test --locked -p zipp-gpu
      # The hand-written Python parser against the generated LALRPOP parser it
      # replaced (compiled only here, by the test-only `reference-parser`
      # feature): equal ASTs, ranges included, or equal errors, over every
      # Python source in the repository, syntax-error snippets, mutated token
      # streams and the runner's CPython Lib. See the fork's FORK.md.
      - name: Test the Python parser against the one it replaced
        working-directory: crates/rustpython-parser-fork
        run: |
          cargo +1.92.0 test --locked --no-default-features --features location,num-bigint --lib
          cargo +1.92.0 test --locked --release --no-default-features --features location,num-bigint,reference-parser --test differential -- --include-ignored --skip throughput
      - name: Build the Python-enabled browser artifact
        working-directory: crates/zipp-wasm
        run: |
          cargo +1.92.0 install wasm-bindgen-cli --locked --version "=$WASM_BINDGEN_CLI"
          export ZIPP_SOURCE_SHA="$(git rev-parse HEAD)"
          ./build-variants.sh all
          wasm-bindgen --target nodejs --out-dir tests/node/pkg target/variants/all/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node -e 'if (!JSON.parse(require("./tests/node/pkg/zipp_wasm.js").zippProfile()).languages.includes("python")) throw Error("Python feature missing")'
          node tests/node/python-frontend.cjs
          node tests/node/python-gpu.cjs
          node tests/node/python-conv2d.cjs
          node tests/node/python-training.cjs
          node tests/node/python-javascript.cjs
          ./build-variants.sh interop
          wasm-bindgen --target nodejs --out-dir tests/node/pkg target/variants/interop/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/python-javascript.cjs --enabled
      # gpu-lab/wasm/kernels.wasm is committed, and everything below loads that
      # blob rather than building one -- so it is rebuilt here from zipp-kernels
      # and the Cargo.lock at this commit, and has to come out byte-identical.
      # The build remaps every recorded path and strips symbol names, so where
      # and on which OS it was built are not part of it; what is left is the
      # source, the lock file and the toolchain.
      - name: Rebuild the numeric kernels and check the committed binary is theirs
        working-directory: crates/zipp-wasm
        run: |
          RUSTUP_TOOLCHAIN=1.92.0 sh gpu-lab/scripts/build_wasm.sh
          git diff --exit-code --stat -- gpu-lab/wasm/kernels.wasm
      - name: Test portable GPU contracts and Python graph authoring
        working-directory: crates/zipp-wasm/gpu-lab
        run: |
          npm test
          python3 tests/test_python.py
      # The local-model plugins, against the `dist/all` artifact the step above
      # built. ZIPP_REQUIRE_INTEGRATION=1 turns the full-checkout gates from
      # skips into failures: without it a missing engine reads as a pass, which
      # is exactly the shape of "it was green and nothing ran".
      #
      # What this makes mandatory before a release: the plugin ABI and its
      # source-digest manifests, the Graph v2 graphs each plugin emits, the
      # engine integration, and the GGUF module's lock file -- the tree is
      # rehashed against the digests scripts/fetch_gguf_wasm.sh recorded, and
      # rust/Cargo.toml is checked to pin the revision that lock names.
      #
      # The suites that need a checkpoint on disk still skip: no weights are
      # redistributed here, and downloading a model per run buys little.
      - name: Test the local-model plugins against that engine
        working-directory: crates/zipp-wasm/model-plugins
        run: ZIPP_REQUIRE_INTEGRATION=1 npm test
      # numpy to evaluate a plugin's graphs independently of ZIPP, safetensors
      # to read a checkpoint the way a published one is stored. transformers is
      # deliberately absent: the tests that compare against it guard the import
      # and skip, so a reference comparison is a local exercise rather than a
      # dependency on a large download here.
      - name: Install what the plugin's Python tests evaluate graphs with
        run: python3 -m pip install --break-system-packages numpy safetensors
      - name: Test the plugin architectures against NumPy
        working-directory: crates/zipp-wasm/model-plugins
        run: npm run test:python

  engine:
    name: Engine (unit tests + audit regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update
      # The parity tests take their expected values from `node -e` and are
      # written against Node 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-engine-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The quarantine manifest is validated even though this lane skips
      # nothing: an expired, stale or ambiguous entry fails every dispatched
      # run and every release gate, so it cannot rot unnoticed.
      - name: Validate the test quarantine manifest
        run: python3 tools/ci_quarantine.py --check --print
      # The quarantine tool's own tests belong here too: the step above trusts
      # `--check`, and `--emit-skips` decides what the broad suite skips.
      - name: Test Test262 scoring, the failure gate and the quarantine tool
        run: >-
          python3 -B -m unittest
          tools.test_run_test262 tools.test_run_test262_dual tools.test_ci_quarantine
      - name: Unit tests and the audit-day regressions (default profile)
        run: >-
          cargo +1.92.0 test --locked -p zipp-vm --no-fail-fast
          --lib
          --test call_order_default
          --test class_body_bindings --test annexb_arguments_bindings
          --test intl_locale_fallback --test global_fingerprint
          --test audit_20260911_host_work
          --test audit_20260911_test262_gaps
          --test audit_20260912_buffer_reentrancy
          --test audit_20260912_bytecode_metadata_width
          --test audit_20260912_collection_clear_live
          --test audit_20260912_decorator_gc_roots
          --test audit_20260912_host_exceptions
          --test audit_20260912_host_input_roots
          --test audit_20260912_iterator_roots
          --test audit_20260912_nested_proxy_roots
          --test audit_20260912_parser_early_errors
          --test audit_20260912_promise_capabilities
          --test audit_20260912_strict_tonumber_bigint
          --test audit_20260912_typedarray_species
          --test audit_20260912_weak_gc
          --test captured_intrinsic_lane
      - name: Build zipp-vm in the configurations its manifest advertises
        run: |
          cargo +1.92.0 check --locked -p zipp-vm --no-default-features
          cargo +1.92.0 check --locked -p zipp-vm --no-default-features --features safe-sandbox

  wasm:
    name: WebAssembly host boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/zipp-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      # The revision actually checked out — which, as a reusable workflow
      # called with `ref`, is NOT `github.sha` (the caller's event revision).
      # Everything below that names a source revision uses this output, so
      # a module built here can never report a commit it was not built from
      # (the 11 September 2026 close audit's ZA-13).
      - name: Record the checked-out source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Rust toolchain and wasm32 target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.92.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            crates/zipp-wasm/target
          key: ci-wasm-${{ runner.os }}-${{ hashFiles('crates/zipp-wasm/Cargo.lock') }}-${{ env.WASM_BINDGEN_CLI }}
      - name: Test the isolated host workspace
        run: cargo +1.92.0 test --locked
      - name: Install the exact matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          if ! test "$(wasm-bindgen --version 2>/dev/null)" = "wasm-bindgen $WASM_BINDGEN_CLI"; then
            cargo +1.92.0 install wasm-bindgen-cli --locked --version "=$WASM_BINDGEN_CLI"
          fi
      - name: Build the production WebAssembly module
        env:
          RUSTFLAGS: >-
            -Dwarnings
            -C link-arg=--max-memory=1073741824
            -C link-arg=-zstack-size=1048576
          # Stamped into zippProfile().source.sha so a loaded artifact can
          # name the revision it was built from: the CHECKED-OUT revision,
          # not the event's (ZA-13).
          ZIPP_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: cargo +1.92.0 build --locked --release --target wasm32-unknown-unknown
      # One list of checks, shared with release.yml and security.yml, so the
      # lanes cannot drift apart.
      - name: Exercise the production host boundary under Node
        run: |
          set -euo pipefail
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/run-boundary-suite.cjs
      - name: Assert the built module names the checked-out revision
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node -e '
            const { zippProfile } = require("./tests/node/pkg/zipp_wasm.js");
            const sha = JSON.parse(zippProfile()).source.sha;
            if (sha !== process.env.EXPECTED_SOURCE_SHA) {
              throw new Error(`module reports source ${sha}, checked out ${process.env.EXPECTED_SOURCE_SHA}`);
            }
            console.log(`module source revision ${sha} matches the checkout`);
          '

  landing:
    name: Landing site and synced playground
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install the locked landing dependencies
        working-directory: landing
        run: npm ci
      # The stats Worker's cache and backoff, content.json validation and SEO,
      # the adventure sample against the checked-in engine, and the claims the
      # page makes about that engine's version, size and limits.
      - name: Test the landing site
        working-directory: landing
        run: npm test
      # `npm run build` runs scripts/sync-playground.mjs first, which copies
      # crates/zipp-wasm/playground into landing/public and rederives the engine
      # cache key, then typechecks and builds with Vite.
      - name: Typecheck and build the production site
        working-directory: landing
        run: |
          npm run typecheck
          npm run build
      # A difference here means the checked-in landing/public copy has drifted
      # from crates/zipp-wasm/playground or from the engine manifest, which is
      # exactly the drift that used to ship unnoticed.
      - name: Require the synchronised playground copy to be up to date
        run: git diff --exit-code -- landing/public
      # The engine pair served at /playground must be a LABELLED build of the
      # announced release. An unlabelled local build shipped a class-method
      # closure bug for a day after 0.0.18 fixed it, because nothing compared
      # the pair's own profile with the release.
      - name: Require the playground engine to be a labelled release build
        working-directory: landing
        run: node scripts/sync-playground.mjs --require-release
      # The playground development server's request boundary: own-Host only,
      # no dot-files, and no crash on a NUL byte in the path.
      - name: Test the playground development server
        run: node --test crates/zipp-wasm/playground/serve.test.cjs
