# The MINIMUM gate every push and pull request pays — deliberately small, so
# a change that breaks a default-semantics regression cannot merge quietly
# while the runner stays cheap:
#
#   engine   the VM's unit tests plus the audit-day regression binaries, on
#            the default profile, and the manifest-advertised feature builds;
#   wasm     the isolated host workspace, the production wasm32 build, and the
#            Node boundary suite against that exact artifact.
#
# Everything heavier is a LOCAL command (see HANDOFF.md "Local verification"):
# the full 230-binary engine suite, the safe-profile and instrumented lanes,
# test262, the three-browser Worker smoke, the density and benchmark
# harnesses. security.yml runs the broader matrix weekly and on demand.
#
# Also a REUSABLE workflow: release.yml calls it with the exact tagged
# revision, so publishing depends on this same gate at that revision rather
# than on whatever `main` build last happened to be green (ZIPP-09).
#
# Pull requests from forks get a read-only token and no secrets; nothing here
# needs more.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The exact revision to check out (release.yml passes the tagged commit)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_CLI: "0.2.126"

jobs:
  engine:
    name: Engine (unit tests + audit regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update
      # The parity tests take their expected values from `node -e` and are
      # written against Node 24.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-engine-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The quarantine manifest is validated even though this lane skips
      # nothing by prefix: an expired or stale entry fails here so it cannot
      # rot unnoticed until the weekly full run.
      - name: Validate the test quarantine manifest
        run: python3 tools/ci_quarantine.py --check --print
      - name: Unit tests and the audit-day regressions (default profile)
        run: >-
          cargo +1.92.0 test --locked -p zipp-vm --no-fail-fast
          --lib
          --test call_order_default
          --test global_fingerprint
          --test audit_20260911_host_work
          --test audit_20260911_test262_gaps
          --test captured_intrinsic_lane
      - name: Build zipp-vm in the configurations its manifest advertises
        run: |
          cargo +1.92.0 check --locked -p zipp-vm --no-default-features
          cargo +1.92.0 check --locked -p zipp-vm --no-default-features --features safe-sandbox

  wasm:
    name: WebAssembly host boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/zipp-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain and wasm32 target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.92.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            crates/zipp-wasm/target
          key: ci-wasm-${{ runner.os }}-${{ hashFiles('crates/zipp-wasm/Cargo.lock') }}-${{ env.WASM_BINDGEN_CLI }}
      - name: Test the isolated host workspace
        run: cargo +1.92.0 test --locked
      - name: Install the exact matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          if ! test "$(wasm-bindgen --version 2>/dev/null)" = "wasm-bindgen $WASM_BINDGEN_CLI"; then
            cargo +1.92.0 install wasm-bindgen-cli --locked --version "=$WASM_BINDGEN_CLI"
          fi
      - name: Build the production WebAssembly module
        env:
          RUSTFLAGS: >-
            -Dwarnings
            -C link-arg=--max-memory=1073741824
            -C link-arg=-zstack-size=1048576
          # Stamped into zippProfile().source.sha so a loaded artifact can
          # name the revision it was built from.
          ZIPP_SOURCE_SHA: ${{ github.sha }}
        run: cargo +1.92.0 build --locked --release --target wasm32-unknown-unknown
      # One list of checks, shared with release.yml and security.yml, so the
      # lanes cannot drift apart.
      - name: Exercise the production host boundary under Node
        run: |
          set -euo pipefail
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/run-boundary-suite.cjs
