# The bounded gate every push and pull request pays: the engine's own test
# suite in its default configuration, the isolated host workspace, the
# advertised feature combinations, and the production WebAssembly host
# boundary under Node. The expensive lanes — test262 conformance, the ARM64
# native matrix, the hostile-input runs — stay on their manual and release
# triggers (security.yml, arm64-native.yml, release.yml); this one exists so a
# change that breaks a default-semantics regression cannot merge quietly.
#
# Pull requests from forks get a read-only token and no secrets; nothing here
# needs more.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run of any branch: the control runs that attribute a runner-
  # specific failure to the audited commit are dispatched this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_CLI: "0.2.126"

jobs:
  engine:
    name: Engine tests (default features)
    runs-on: ubuntu-latest
    # The suite is 228 binaries, several of which sweep every execution mode
    # in child processes and a few of which run sustained-garbage loops for
    # minutes; 45 minutes cut the first run off at 144 binaries.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update
      # The parity tests take their expected values from `node -e` and are
      # written against Node 24 (`Float16Array` exists there; the runner's
      # default Node lacks it and typedarray_interp_index_fast diverges).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-engine-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # The semantic regressions run their own mode matrix (interpreter,
      # forced JIT, GC stress, both call-order switches) in child processes.
      # Every binary runs even after one fails, so a red run names all of
      # its failures rather than the first.
      #
      # Quarantined, and said so in the log rather than treated as passing:
      # three of bool_home_clobber's INT-GPR planning assertions
      # (denseint-4's one-slot split spill and the two-spill cap) fail on this
      # runner at the audited commit 40993c4d as well — a control run of that
      # commit with only this workflow added, run 34034702340 — on identical
      # bytecode, so they describe the planner's behaviour on the developer's
      # machine rather than a regression. Remove the skips once the planner's
      # expectation is machine-independent.
      - name: Test the engine
        run: |
          echo "::notice title=Quarantined::boolhome_denseint_four_engages_one_bounded_split_spill, boolhome_denseint_four_no_spill_switch_refuses_split_spill and boolhome_split_spill_bridge_stays_capped_at_one are skipped on this runner (pre-existing at 40993c4d; see the comment in ci.yml)."
          cargo +1.92.0 test --locked -p zipp-vm --no-fail-fast -- \
            --skip boolhome_denseint_four_engages_one_bounded_split_spill \
            --skip boolhome_denseint_four_no_spill_switch_refuses_split_spill \
            --skip boolhome_split_spill_bridge_stays_capped_at_one

  wasm:
    name: WebAssembly host boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/zipp-wasm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and wasm32 target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.92.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            crates/zipp-wasm/target
          key: ci-wasm-${{ runner.os }}-${{ hashFiles('crates/zipp-wasm/Cargo.lock') }}-${{ env.WASM_BINDGEN_CLI }}
      - name: Test the isolated host workspace
        run: cargo +1.92.0 test --locked
      # A passing unified build proves nothing about the isolated profiles the
      # library advertises; check each the way release.yml does.
      - name: Build zipp-vm in the configurations its manifest advertises
        run: |
          cargo +1.92.0 check --locked --manifest-path ../zipp-vm/Cargo.toml --no-default-features
          cargo +1.92.0 check --locked --manifest-path ../zipp-vm/Cargo.toml --no-default-features --features safe-sandbox
      - name: Install the exact matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          if ! test "$(wasm-bindgen --version 2>/dev/null)" = "wasm-bindgen $WASM_BINDGEN_CLI"; then
            cargo +1.92.0 install wasm-bindgen-cli --locked --version "=$WASM_BINDGEN_CLI"
          fi
      - name: Build the production WebAssembly module
        env:
          RUSTFLAGS: >-
            -Dwarnings
            -C link-arg=--max-memory=1073741824
            -C link-arg=-zstack-size=1048576
        run: cargo +1.92.0 build --locked --release --target wasm32-unknown-unknown
      - name: Exercise the production host boundary under Node
        run: |
          set -euo pipefail
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/check-wasm-memory.cjs tests/node/pkg/zipp_wasm_bg.wasm
          node tests/node/host-contract.cjs
          node tests/node/buffer-ceiling.cjs
          node tests/node/budget-and-seed.cjs
          node tests/node/large-alloc-gc.cjs
          node tests/node/output-budget.cjs
          node tests/node/host-writeback-identity.cjs
          node tests/node/worker-deadline.cjs
          node tests/node/audit-defaults.cjs
          node tests/node/profile-matches-readme.cjs
          node tests/node/syntax-corpus.cjs
