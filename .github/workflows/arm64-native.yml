name: ARM64 native JIT

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arm64-native.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/zipp-vm/**"
      - "crates/zipp-cli/**"
      - "crates/regress-fork/**"
  pull_request:
    paths:
      - ".github/workflows/arm64-native.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/zipp-vm/**"
      - "crates/zipp-cli/**"
      - "crates/regress-fork/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Prove the runner is ARM64
        shell: bash
        run: rustc +stable --print cfg | grep -qx 'target_arch="aarch64"'
      - name: ARM64 VM unit and mechanism tests
        run: cargo +stable test --locked -p zipp-vm --lib
      - name: ARM64 tier differential slice
        if: runner.os == 'Linux'
        run: cargo +stable test --locked -p zipp-vm --test jit_tier_fuzz tier_differential_ci_slice -- --exact --nocapture
      - name: Sandboxed CLI integration tests
        if: runner.os == 'Linux'
        run: cargo +stable test --locked -p zipp-cli --test sandbox
