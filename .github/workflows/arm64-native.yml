name: ARM64 native JIT

# Manual-trigger only because ARM64 runners are comparatively expensive.
#   gh workflow run arm64-native.yml
on:
  workflow_dispatch:

jobs:
  native-arm64:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-Dwarnings"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Prove the runner is ARM64
        shell: bash
        run: rustc +stable --print cfg | grep -qx 'target_arch="aarch64"'
      # Keep this single-threaded smoke test ahead of the parallel library
      # suite. If executable-memory publication regresses on Windows ARM64,
      # the log will identify the failing phase instead of only reporting that
      # the complete test process died.
      - name: Windows ARM64 JIT publication smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $test = 'codegen::tests::native_loop_executes_and_returns_x0'
          $listed = cargo +stable test --locked -p zipp-vm --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($listed -notcontains "${test}: test") {
            throw "required Windows ARM64 publication smoke test is missing: $test"
          }
          cargo +stable test --locked -p zipp-vm --lib $test -- --exact --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ARM64 VM unit and mechanism tests
        run: cargo +stable test --locked -p zipp-vm --lib
      - name: ARM64 tier differential slice
        if: runner.os == 'Linux'
        run: cargo +stable test --locked -p zipp-vm --test jit_tier_fuzz tier_differential_ci_slice -- --exact --nocapture
      - name: Sandboxed CLI integration tests
        if: runner.os == 'Linux'
        run: cargo +stable test --locked -p zipp-cli --test sandbox
