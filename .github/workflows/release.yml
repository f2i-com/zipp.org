name: Release

# A release is always built from an existing immutable-looking version tag.
# The manual entry point is useful for retrying infrastructure failures, but it
# deliberately does not create a tag or release an arbitrary branch/SHA.
#
# Publishing is gated on both reusable CI and the broad security workflow at
# the EXACT tagged revision. That includes the full native suite on the release
# toolchain, the safe profile, the Windows x86-64 CLI and JIT VM, native and
# WASM sandboxes, production boundary suite, real browser Workers, the landing
# site, dependency audit, and the pinned Test262 corpus with exact expected
# failures, in addition to this workflow's validation and release builds. A
# green `main` at some other revision is not a release gate. The Node boundary
# checks the WASM job runs come from the one shared list
# (tests/node/run-boundary-suite.cjs) so this lane cannot drift from CI.
#
# The SOURCE is bound to the tag; the GATE DEFINITIONS are not. A dispatched
# run uses this file — and resolves `uses: ./.github/workflows/{ci,security}.yml`
# — at the ref it was dispatched on, not at the tag. `validate` therefore
# refuses a dispatch from anywhere but `main` or the requested tag, and the
# `publish` job runs in the `release` environment. Configure that environment
# with required reviewers and a deployment policy limited to `v*` tags: the
# workflow cannot enforce that part itself (see SECURITY.md, "Release
# publishing").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.0.19)
        required: true
        default: v0.0.19
        type: string
      skip_heavy:
        description: >-
          Skip the native workspace test suite and the pinned Test262 run.
          Only for re-tagging a DOCS-ONLY change onto an engine revision whose
          identical code the full gate already ran; the run log shows the skip.
          A tag push never skips anything.
        required: false
        default: false
        type: boolean

# Build jobs can only read the repository. The release job raises this to
# contents:write for the one step that publishes the already-built assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_CLI: "0.2.126"

jobs:
  validate:
    name: Validate release tag and package versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.requested-tag.outputs.tag }}
      version: ${{ steps.package-version.outputs.version }}
      commit: ${{ steps.package-version.outputs.commit }}
      tag_object: ${{ steps.package-version.outputs.tag_object }}
    steps:
      # A dispatched run takes this workflow, and the two reusable gates it
      # calls, from the ref it was dispatched on — never from the tag. Without
      # this guard a collaborator could dispatch a copy of release.yml with
      # `needs: [ci, security]` removed and publish assets under a canonical
      # tag, and an old tag retried from a rewritten `main` would run the wrong
      # gate lists. Restricting the dispatch ref is what makes the header's
      # claim about the gates true.
      - name: Refuse a dispatch from any ref but main or the requested tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" \
                && "$DISPATCH_REF" != "refs/tags/$REQUESTED_TAG" ]]; then
            echo "release.yml must be dispatched from refs/heads/main or refs/tags/$REQUESTED_TAG, not $DISPATCH_REF" >&2
            exit 1
          fi

      - name: Validate requested tag format
        id: requested-tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tags must use canonical vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push run checks out the event object rather than re-resolving a
          # tag that could have moved while the run was queued. The validation
          # below then proves the current tag still names this object/commit.
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', steps.requested-tag.outputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the checkout and manifests match the tag
        id: package-version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.requested-tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_object="$(git rev-parse "$RELEASE_TAG")"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "checkout $head_commit does not match $RELEASE_TAG ($tag_commit)" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" \
                && "$EVENT_SHA" != "$tag_object" \
                && "$EVENT_SHA" != "$tag_commit" ]]; then
            echo "tag moved after this push event: event=$EVENT_SHA current=$tag_object/$tag_commit" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          python3 - "$version" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          root = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          wasm = tomllib.loads(
              pathlib.Path("crates/zipp-wasm/Cargo.toml").read_text(encoding="utf-8")
          )
          actual = {
              "native workspace": root["workspace"]["package"]["version"],
              "zipp-wasm": wasm["package"]["version"],
              "landing": json.loads(
                  pathlib.Path("landing/package.json").read_text(encoding="utf-8")
              )["version"],
          }
          mismatches = [f"{name}={value}" for name, value in actual.items() if value != expected]
          if mismatches:
              raise SystemExit(
                  f"tag version {expected} does not match " + ", ".join(mismatches)
              )
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

  # The exact-revision correctness gate: everything ordinary CI proves, at
  # the tagged commit. Quarantined tests are the manifest's, printed in the
  # log there; nothing else is skipped.
  ci:
    name: CI at the tagged revision
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  security:
    name: Full release gate at the tagged revision
    needs: validate
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
      # False for every tag push; a dispatch may opt out of the two longest
      # jobs for a docs-only retag (see the input's description).
      skip_heavy: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_heavy == true }}

  native:
    name: Native CLI (${{ matrix.rust_target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            archive_suffix: .tar.gz
          - os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            archive_suffix: .zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.92.0"
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add ${{ matrix.rust_target }} --toolchain 1.92.0

      - name: Build the release CLI from the locked workspace
        run: >-
          cargo build --locked --release --package zipp-cli --bin zipp
          --target ${{ matrix.rust_target }}

      # Run the PACKAGED-ARCHITECTURE binary through a JIT tier and the
      # recursion limit. A bare `console.log` never leaves the interpreter, so
      # the Win64 ABI, the unwind/stack-probe interaction with the 256 MiB main
      # thread, and VirtualProtect code publication went untested in the gate
      # that ships them. The expected line is what `node` prints for this file.
      - name: Smoke-test the release CLI at a JIT tier
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SMOKE_EXPECTED: zipp-release-smoke 520003 100 RangeError
        run: |
          set -euo pipefail
          # target/ is ignored, and a relative path avoids Windows/bash path
          # translation for the shared step.
          cat > target/zipp-release-smoke.js <<'SMOKE'
          let total = 0;
          for (let i = 0; i < 200000; i++) total = (total + i * 3) % 1000003;
          function depth(n) { return n === 0 ? 0 : depth(n - 1) + 1; }
          let guarded = "no-range-error";
          try { depth(1e7); } catch (e) { guarded = e.constructor.name; }
          console.log(`zipp-release-smoke ${total} ${depth(100)} ${guarded}`);
          SMOKE
          binary="target/$RUST_TARGET/release/zipp"
          [[ "$RUNNER_OS" != "Windows" ]] || binary="$binary.exe"
          actual="$(ZIPP_JIT_THRESHOLD=1 "$binary" js target/zipp-release-smoke.js | tr -d '\r')"
          if [[ "$actual" != "$SMOKE_EXPECTED" ]]; then
            echo "smoke output: $actual (expected: $SMOKE_EXPECTED)" >&2
            exit 1
          fi
          # Prove a tier really compiled rather than trusting the loop count.
          # Captured, not piped: `| grep -q` closes the pipe at its first
          # match, and the engine next log write then hits EPIPE, where the
          # print macros panic — this step aborted (signal 6) rather than
          # reporting a result.
          jitlog="$(ZIPP_JIT_THRESHOLD=1 ZIPP_JITLOG=1 "$binary" js target/zipp-release-smoke.js 2>&1)"
          grep -q 'compiled' <<<"$jitlog"

      - name: Package Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/zipp"
          bundle="zipp-$RELEASE_VERSION-$RUST_TARGET"
          mkdir -p "dist/$bundle"
          install -m 0755 "$binary" "dist/$bundle/zipp"
          install -m 0644 README.md LICENSE-APACHE "dist/$bundle/"
          "$binary" --version --json > "dist/$bundle/BUILD-INFO.json"
          # The commit and clean-tree fields are checked HERE, on first publish,
          # not only on the idempotent re-run path: an archive reporting another
          # commit, or dirty:true (build.rs reports dirty whenever its `git
          # status` probe fails), used to be published immutably and then fail
          # every later re-run.
          jq -e --arg version "$RELEASE_VERSION" --arg commit "$EXPECTED_COMMIT" \
            '.name == "zipp" and .version == $version and
             .commit == $commit and .dirty == false' \
            "dist/$bundle/BUILD-INFO.json" >/dev/null
          (
            cd dist
            tar -czf "$bundle.tar.gz" "$bundle"
          )

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $PWD "target/$env:RUST_TARGET/release/zipp.exe"

          $bundle = "zipp-$env:RELEASE_VERSION-$env:RUST_TARGET"
          $bundlePath = Join-Path $PWD "dist/$bundle"
          New-Item -ItemType Directory -Path $bundlePath -Force | Out-Null
          $packagedBinary = Join-Path $bundlePath 'zipp.exe'
          Copy-Item -LiteralPath $binary -Destination $packagedBinary

          # The Windows CLI runs the VM on its process main thread, so the PE
          # stack fields are a runtime safety contract. Inspect the exact copy
          # that will be archived rather than assuming the link argument took
          # effect on the release-profile binary.
          function Get-PeStackSizes([string] $Path) {
            [byte[]] $bytes = [IO.File]::ReadAllBytes($Path)
            if ($bytes.LongLength -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "packaged zipp.exe has no valid DOS header"
            }

            [uint64] $peOffset64 = [BitConverter]::ToUInt32($bytes, 0x3c)
            if ($peOffset64 + 26 -gt [uint64] $bytes.LongLength) {
              throw "packaged zipp.exe has a truncated PE header"
            }
            [int] $peOffset = $peOffset64
            if ($bytes[$peOffset] -ne 0x50 -or
                $bytes[$peOffset + 1] -ne 0x45 -or
                $bytes[$peOffset + 2] -ne 0 -or
                $bytes[$peOffset + 3] -ne 0) {
              throw "packaged zipp.exe has no valid PE signature"
            }

            # The optional header follows the 4-byte signature and 20-byte
            # COFF header. PE32+ stores the two stack fields as u64; PE32 uses
            # u32 fields at the corresponding offsets.
            [int] $optional = $peOffset + 24
            [uint16] $magic = [BitConverter]::ToUInt16($bytes, $optional)
            if ($magic -eq 0x20b) {
              if ([uint64] $optional + 0x58 -gt [uint64] $bytes.LongLength) {
                throw "packaged zipp.exe has a truncated PE32+ optional header"
              }
              [uint64] $reserve = [BitConverter]::ToUInt64($bytes, $optional + 0x48)
              [uint64] $commit = [BitConverter]::ToUInt64($bytes, $optional + 0x50)
            } elseif ($magic -eq 0x10b) {
              if ([uint64] $optional + 0x50 -gt [uint64] $bytes.LongLength) {
                throw "packaged zipp.exe has a truncated PE32 optional header"
              }
              [uint64] $reserve = [BitConverter]::ToUInt32($bytes, $optional + 0x48)
              [uint64] $commit = [BitConverter]::ToUInt32($bytes, $optional + 0x4c)
            } else {
              throw ('packaged zipp.exe has unexpected optional-header magic 0x{0:x}' -f $magic)
            }

            return [pscustomobject]@{ Reserve = $reserve; Commit = $commit }
          }

          $stack = Get-PeStackSizes $packagedBinary
          if ($stack.Reserve -ne 268435456 -or $stack.Commit -ne 4096) {
            throw "packaged zipp.exe has stack reserve=$($stack.Reserve), commit=$($stack.Commit); expected reserve=268435456, commit=4096"
          }
          Write-Host "verified packaged PE stack: reserve=$($stack.Reserve), commit=$($stack.Commit)"

          Copy-Item -LiteralPath @('README.md', 'LICENSE-APACHE') -Destination $bundlePath
          $buildInfo = & $binary --version --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = $buildInfo | ConvertFrom-Json
          # The commit and clean-tree fields are checked HERE, on first publish,
          # not only on the idempotent re-run path: an archive reporting another
          # commit, or dirty:true (build.rs reports dirty whenever its `git
          # status` probe fails), used to be published immutably and then fail
          # every later re-run.
          if ($identity.name -ne 'zipp' -or
              $identity.version -ne $env:RELEASE_VERSION -or
              $identity.commit -ne $env:EXPECTED_COMMIT -or
              $identity.dirty -ne $false) {
            throw "binary identity does not match release $env:RELEASE_VERSION at $env:EXPECTED_COMMIT (commit=$($identity.commit), dirty=$($identity.dirty))"
          }
          [IO.File]::WriteAllText(
            (Join-Path $bundlePath 'BUILD-INFO.json'),
            ($buildInfo + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          $archivePath = Join-Path $PWD "dist/$bundle.zip"
          Compress-Archive -LiteralPath $bundlePath -DestinationPath $archivePath -CompressionLevel Optimal

      - name: Upload native release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.rust_target }}
          path: dist/zipp-${{ needs.validate.outputs.version }}-${{ matrix.rust_target }}${{ matrix.archive_suffix }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  wasm:
    name: Browser WebAssembly (${{ matrix.variant }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: javascript
            suffix: web
            features: ""
            stack_bytes: 1048576
            languages: '["javascript"]'
          - variant: javascript-python
            suffix: web-python
            features: "--features python"
            stack_bytes: 16777216
            languages: '["javascript","python"]'
          # Python without torch: torch ships separately as the web-torch
          # package (zipp_torch.wasm), which a host adds with addPythonPackage.
          - variant: javascript-python-base
            suffix: web-python-base
            features: "--features python-base"
            stack_bytes: 16777216
            languages: '["javascript","python"]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: crates/zipp-wasm
    env:
      RUSTUP_TOOLCHAIN: "1.92.0"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain and wasm32 target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.92.0

      - name: Select the Node.js smoke-test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Test the exact-suite WASM comparison harness
        run: node --no-warnings --test ../../bench/comparison/test_run_wasm_suites.mjs

      - name: Test the isolated host workspace
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked

      - name: Test artifact-only VM specializations
        env:
          RUSTFLAGS: -Dwarnings
        run: >-
          cargo test --locked --manifest-path ../zipp-vm/Cargo.toml
          --no-default-features
          --features safe-sandbox,meter-only,wasm-no-fs-loader,wasm-single-agent
          --test no_fs_loader --test wasm_single_agent

      - name: Build zipp-vm in the configurations its manifest advertises
        # Every other job builds this crate with `meter-only`, which pulls in
        # `instrument`. That hid a `renew_step_budget` reaching straight for
        # `instr_rec` — a field that only exists under that feature — so the
        # crate did not compile on its own, nor as the `--no-default-features`
        # pure interpreter its Cargo.toml offers. Feature unification in the
        # workspace build meant nothing ever noticed.
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path ../zipp-vm/Cargo.toml
          cargo check --locked --manifest-path ../zipp-vm/Cargo.toml --no-default-features
          cargo check --locked --manifest-path ../zipp-vm/Cargo.toml             --no-default-features --features safe-sandbox

      - name: Install the exact matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --locked --version "=$WASM_BINDGEN_CLI"
          test "$(wasm-bindgen --version)" = "wasm-bindgen $WASM_BINDGEN_CLI"

      - name: Build the locked production WebAssembly module
        # RUSTFLAGS overrides target config, so repeat both security-critical
        # linker limits while making compiler warnings fatal. The tagged
        # commit is stamped into zippProfile().source.sha so a loaded artifact
        # names the revision it came from; the artifact hashes stay external
        # (SHA256SUMS), never embedded.
        env:
          RUSTFLAGS: >-
            -Dwarnings
            -C link-arg=--max-memory=1073741824
            -C link-arg=-zstack-size=${{ matrix.stack_bytes }}
          ZIPP_SOURCE_SHA: ${{ needs.validate.outputs.commit }}
        run: cargo build --locked --release --target wasm32-unknown-unknown ${{ matrix.features }}

      # The one shared list (tests/node/run-boundary-suite.cjs): the same
      # checks CI runs, including the parse-shape limits calibrated against
      # the JS artifact's 1 MiB stack (Python uses 16 MiB; v0.0.1 shipped limits that
      # rejected two working applications because the only browser check at
      # the time parsed three tokens) and the audit regression suites the
      # release lane used to omit.
      - name: Exercise the production host boundary under Node
        if: matrix.variant != 'javascript-python-base'
        run: |
          set -euo pipefail
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/run-boundary-suite.cjs

      # The base Python artifact has no torch until a host adds the package;
      # the torch job below proves base + package against the complete one.
      - name: Exercise the Python frontend without torch under Node
        if: matrix.variant == 'javascript-python-base'
        run: |
          set -euo pipefail
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/python-frontend.cjs

      - name: Exercise the combined artifact's Torch and interop contracts
        if: matrix.variant == 'javascript-python'
        run: |
          node tests/node/python-conv2d.cjs
          node tests/node/python-training.cjs
          node tests/node/python-javascript.cjs

      - name: Package browser JS, TypeScript declarations, and WebAssembly
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          WASM_VARIANT: ${{ matrix.variant }}
          WASM_SUFFIX: ${{ matrix.suffix }}
          EXPECTED_LANGUAGES: ${{ matrix.languages }}
          STACK_BYTES: ${{ matrix.stack_bytes }}
        run: |
          set -euo pipefail
          export WASM_VARIANT
          bundle="zipp-wasm-$RELEASE_VERSION-$WASM_SUFFIX"
          archive="$bundle.zip"
          mkdir -p "dist/$bundle"
          # Drop the name and producers sections from the SHIPPED bundle: 329 KB
          # raw and ~75 KB brotli of symbol names no browser reads. The nodejs
          # build above keeps them, so the harnesses and any profile of this
          # release still resolve real function names.
          #
          # Deliberately no `wasm-opt` step. Measured on this module it is a wire
          # REGRESSION — -Oz is 390 KB smaller uncompressed and 22 KB larger after
          # brotli, because binaryen trades away the regularity the compressor
          # feeds on — and it measured 2.04% slower to execute (-O3: 1.39%). See
          # crates/zipp-wasm/README.md.
          wasm-bindgen --target web --out-dir "dist/$bundle" \
            --remove-name-section --remove-producers-section \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/strip-target-features.cjs \
            "dist/$bundle/zipp_wasm_bg.wasm" \
            "dist/$bundle/zipp_wasm_bg.stripped.wasm"
          mv "dist/$bundle/zipp_wasm_bg.stripped.wasm" \
            "dist/$bundle/zipp_wasm_bg.wasm"
          node --input-type=module --check < "dist/$bundle/zipp_wasm.js"
          # Validation on the artifact AFTER stripping: memory/import surface,
          # and that the shipped module reports the tagged revision.
          node tests/node/check-wasm-memory.cjs "dist/$bundle/zipp_wasm_bg.wasm"
          # Pin all generated type surfaces as well as the runtime smoke below:
          # a mutually stale JS+WASM pair can execute successfully while
          # silently omitting an API added by the tagged Rust source.
          grep -Fq 'getGlobalsFingerprint(indices: any): any;' \
            "dist/$bundle/zipp_wasm.d.ts"
          grep -Fq 'readonly engine_getGlobalsFingerprint:' \
            "dist/$bundle/zipp_wasm.d.ts"
          grep -Fq 'export const engine_getGlobalsFingerprint:' \
            "dist/$bundle/zipp_wasm_bg.wasm.d.ts"
          BUNDLE_PATH="$(pwd)/dist/$bundle" EXPECTED_COMMIT="$EXPECTED_COMMIT" node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const bundle = process.env.BUNDLE_PATH;
          const zipp = await import(pathToFileURL(path.join(bundle, "zipp_wasm.js")));
          const wasmBytes = fs.readFileSync(path.join(bundle, "zipp_wasm_bg.wasm"));
          const wasmModule = new WebAssembly.Module(wasmBytes);
          if (!WebAssembly.Module.exports(wasmModule).some(
            entry => entry.kind === "function" && entry.name === "engine_getGlobalsFingerprint"
          )) {
            throw new Error("browser package lacks raw engine_getGlobalsFingerprint export");
          }
          if (typeof zipp.Engine?.prototype?.getGlobalsFingerprint !== "function") {
            throw new Error("browser package lacks Engine.getGlobalsFingerprint glue");
          }
          await zipp.default({
            module_or_path: wasmModule,
          });
          const profile = JSON.parse(zipp.zippProfile());
          if (profile.source?.sha !== process.env.EXPECTED_COMMIT) {
            throw new Error(`browser package reports source ${profile.source?.sha}, expected ${process.env.EXPECTED_COMMIT}`);
          }
          if (profile.version !== process.env.RELEASE_VERSION) {
            throw new Error(`browser package reports version ${profile.version}, expected ${process.env.RELEASE_VERSION}`);
          }
          if (JSON.stringify(profile.languages) !== process.env.EXPECTED_LANGUAGES) {
            throw new Error(`wrong language variant: ${JSON.stringify(profile.languages)}`);
          }
          fs.writeFileSync(path.join(bundle, "PROFILE.json"), JSON.stringify(profile, null, 2) + "\n");
          if (profile.languages.includes("python") && process.env.WASM_VARIANT === "javascript-python-base") {
            const python = new zipp.Engine();
            try {
              python.initSource("try:\n    import torch\nexcept ModuleNotFoundError as e:\n    print(e.name)\nprint(sum(x * x for x in range(4)))", "python");
              if (JSON.stringify(python.takeOutput()) !== '["torch","14"]') {
                throw new Error("packaged Python (without torch) smoke failed");
              }
            } finally { python.dispose(); python.free(); }
          } else if (profile.languages.includes("python")) {
            const python = new zipp.Engine();
            try {
              python.initSource("import torch\nx = torch.tensor([1.0, 2.0, 3.0])\nprint((x * 2).tolist())", "python");
              if (JSON.stringify(python.takeOutput()) !== '["[2.0, 4.0, 6.0]"]') {
                throw new Error("packaged Python/Torch smoke failed");
              }
            } finally { python.dispose(); python.free(); }
          }
          const engine = new zipp.Engine();
          try {
            const symbols = engine.initScript(`
              let fingerprintProbe = { items: [1] };
              function mutateFingerprintProbe() { fingerprintProbe.items.push(2); }
              console.log("zipp-web-release-smoke");
            `);
            const indices = [symbols.fingerprintProbe.index];
            const beforeValue = engine.getGlobalsBatch(indices);
            const before = engine.getGlobalsFingerprint(indices);
            const stable = engine.getGlobalsFingerprint(indices);
            if (!Array.isArray(before)
                || before.length !== 1
                || !Number.isSafeInteger(before[0])
                || before[0] < 0
                || stable[0] !== before[0]) {
              throw new Error(`invalid globals fingerprint binding: ${JSON.stringify({ before, stable })}`);
            }
            engine.callFunction("mutateFingerprintProbe", []);
            const afterValue = engine.getGlobalsBatch(indices);
            const after = engine.getGlobalsFingerprint(indices);
            if (JSON.stringify(beforeValue) === JSON.stringify(afterValue)
                || !Array.isArray(after)
                || before[0] === after[0]) {
              throw new Error(
                `globals fingerprint did not follow an in-place mutation: ${JSON.stringify({ before, after })}`
              );
            }
            const output = engine.takeOutput();
            if (JSON.stringify(output) !== '["zipp-web-release-smoke"]') {
              throw new Error(`unexpected browser-package output: ${JSON.stringify(output)}`);
            }
          } finally {
            engine.dispose();
            engine.free();
          }
          JS
          install -m 0644 README.md ../../LICENSE-APACHE "dist/$bundle/"
          # The reference host adapter ships WITH the bindings it was written
          # against, at this exact revision: the README's host-adapter section
          # used to refer to a directory the archive did not contain (the
          # 11 September 2026 close audit's ZA-14). Its version is recorded
          # beside the commit so a consumer can check SDK/API compatibility.
          mkdir -p "dist/$bundle/host-sdk"
          install -m 0644 host-sdk/zipp-host.mjs host-sdk/zipp-host.worker.mjs host-sdk/README.md \
            "dist/$bundle/host-sdk/"
          # gpu-lab's runtime and kernels ship; model-plugins/ deliberately does
          # not. It is an experimental, private, source-only package, tested in
          # CI from the tree (ci.yml's python job) and used from a checkout.
          # Shipping it needs it copied here and a test against the unpacked
          # archive, the way the smoke test above loads the engine.
          if [[ "$WASM_VARIANT" == "javascript-python" ]]; then
            mkdir -p "dist/$bundle/gpu-lab/wasm" "dist/$bundle/docs"
            cp -R gpu-lab/src "dist/$bundle/gpu-lab/"
            install -m 0644 gpu-lab/wasm/kernels.wasm "dist/$bundle/gpu-lab/wasm/"
            install -m 0644 gpu-lab/LICENSE gpu-lab/NOTICE "dist/$bundle/gpu-lab/"
            install -m 0644 ../../docs/TORCH_COMPATIBILITY.md "dist/$bundle/docs/"
          fi
          sdk_version="$(node -e 'import("./host-sdk/zipp-host.mjs").then((m) => console.log(m.ZIPP_HOST_SDK_VERSION))')"
          node --input-type=module --check < "dist/$bundle/host-sdk/zipp-host.mjs"
          node --input-type=module --check < "dist/$bundle/host-sdk/zipp-host.worker.mjs"
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'wasm-bindgen=%s\n' "$(wasm-bindgen --version)"
            printf 'variant=%s\n' "$WASM_VARIANT"
            printf 'languages=%s\n' "$EXPECTED_LANGUAGES"
            printf 'stack-bytes=%s\n' "$STACK_BYTES"
            printf 'target=wasm32-unknown-unknown\n'
            printf 'host-sdk=%s\n' "$sdk_version"
          } > "dist/$bundle/BUILD-INFO.txt"
          (
            cd "dist/$bundle"
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (
            cd dist
            zip -q -9 -r "$archive" "$bundle"
          )

      - name: Upload browser WebAssembly release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm-${{ matrix.suffix }}
          path: crates/zipp-wasm/dist/zipp-wasm-${{ needs.validate.outputs.version }}-${{ matrix.suffix }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  torch:
    name: Browser WebAssembly (torch package)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/zipp-wasm
    env:
      RUSTUP_TOOLCHAIN: "1.92.0"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain and wasm32 target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.92.0

      - name: Select the Node.js smoke-test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the exact matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli --locked --version "=$WASM_BINDGEN_CLI"
          test "$(wasm-bindgen --version)" = "wasm-bindgen $WASM_BINDGEN_CLI"

      # The package and the two engines it is checked against, from the same
      # locked source: `python` (without torch) + zipp_torch.wasm must print
      # what the complete `all` artifact prints, byte for byte.
      - name: Build the torch package and the engines it pairs with
        env:
          ZIPP_SOURCE_SHA: ${{ needs.validate.outputs.commit }}
        run: ./build-variants.sh all python torch

      - name: Prove the package against the complete artifact under Node
        run: |
          set -euo pipefail
          wasm-bindgen --target nodejs --out-dir /tmp/pkg-all \
            target/variants/all/wasm32-unknown-unknown/release/zipp_wasm.wasm
          wasm-bindgen --target nodejs --out-dir /tmp/pkg-python \
            target/variants/python/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/python-plugin.cjs /tmp/pkg-all /tmp/pkg-python

      - name: Package the torch module and its loader
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bundle="zipp-wasm-$RELEASE_VERSION-web-torch"
          archive="$bundle.zip"
          mkdir -p "dist/$bundle"
          install -m 0644 dist/torch/zipp_torch.wasm dist/torch/zipp_torch.js "dist/$bundle/"
          install -m 0644 README.md ../../LICENSE-APACHE "dist/$bundle/"
          mkdir -p "dist/$bundle/docs"
          install -m 0644 ../../docs/TORCH_COMPATIBILITY.md "dist/$bundle/docs/"
          node --input-type=module --check < "dist/$bundle/zipp_torch.js"
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'variant=torch\n'
            printf 'pairs-with=zipp-wasm-%s-web-python-base\n' "$RELEASE_VERSION"
            printf 'target=wasm32-unknown-unknown\n'
          } > "dist/$bundle/BUILD-INFO.txt"
          (
            cd "dist/$bundle"
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (
            cd dist
            zip -q -9 -r "$archive" "$bundle"
          )

      - name: Upload the torch package release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm-web-torch
          path: crates/zipp-wasm/dist/zipp-wasm-${{ needs.validate.outputs.version }}-web-torch.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    # Both reusable gates run at the validated tag commit. Publishing waits
    # for the full native, safe-profile, sandbox, Worker and Test262 matrix.
    needs: [validate, ci, security, native, wasm, torch]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The one job with write access. The environment is where the repository
    # settings attach required reviewers and a deployment policy limited to
    # `v*` tags, which is the only defence against a modified copy of this
    # workflow being dispatched from a side branch (`contents: write` is
    # otherwise available to anyone who can push a workflow). See SECURITY.md,
    # "Release publishing".
    environment: release
    permissions:
      contents: write
    steps:
      - name: Revalidate the tag before publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the release tag still names the built commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          current_object="$(git rev-parse "$RELEASE_TAG")"
          current_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$current_object" != "$EXPECTED_TAG_OBJECT" \
                || "$current_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "tag moved during the release: expected=$EXPECTED_TAG_OBJECT/$EXPECTED_COMMIT current=$current_object/$current_commit" >&2
            exit 1
          fi

      # docs/releases/<version>.md becomes the release body verbatim, and
      # README.md is copied into both native archives, so a leftover
      # "release candidate" line or an older `version=` in a download command
      # ships as the published release's own instructions. A relative link in
      # the notes is also broken: GitHub resolves it against the repository
      # root with no ref, which 404s.
      - name: Refuse pre-release notes and stale download instructions
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          status=0
          notes="docs/releases/$RELEASE_VERSION.md"
          if [[ -f "$notes" ]]; then
            if grep -niE 'release candidate|not evidence of a published release' "$notes"; then
              echo "$notes still reads as pre-release notes; it becomes the release body" >&2
              status=1
            fi
            if grep -nE '\]\(\.{1,2}/' "$notes"; then
              echo "$notes uses a relative link; a release body needs https://github.com/${{ github.repository }}/blob/$RELEASE_TAG/... " >&2
              status=1
            fi
          fi
          if grep -niE 'release candidate' README.md; then
            echo "README.md still calls this checkout a release candidate" >&2
            status=1
          fi
          while read -r pinned; do
            if [[ -n "$pinned" && "$pinned" != "$RELEASE_VERSION" ]]; then
              echo "README.md download commands pin $pinned, not $RELEASE_VERSION" >&2
              status=1
            fi
          done < <(grep -oE '(version=|\$version = .)[0-9]+\.[0-9]+\.[0-9]+' README.md \
                     | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          exit "$status"

      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify the asset set and write release checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "zipp-$RELEASE_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "zipp-$RELEASE_VERSION-x86_64-pc-windows-msvc.zip"
            "zipp-wasm-$RELEASE_VERSION-web.zip"
            "zipp-wasm-$RELEASE_VERSION-web-python.zip"
            "zipp-wasm-$RELEASE_VERSION-web-python-base.zip"
            "zipp-wasm-$RELEASE_VERSION-web-torch.zip"
          )
          for asset in "${expected[@]}"; do
            test -f "dist/$asset"
          done
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${wanted[*]}" ]]; then
            printf 'unexpected release asset set:\n%s\n' "${actual[*]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Publish the existing tag and immutable asset set
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          verify_remote_tag() {
            remote_object="$(
              gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha
            )"
            if [[ "$remote_object" != "$EXPECTED_TAG_OBJECT" ]]; then
              echo "remote tag moved during the release: expected=$EXPECTED_TAG_OBJECT current=$remote_object" >&2
              exit 1
            fi
          }

          verify_remote_tag
          if gh release view "$RELEASE_TAG" \
              --json isDraft,isImmutable,isPrerelease,url > existing-release.json 2>/dev/null; then
            is_draft="$(jq -r .isDraft existing-release.json)"
            is_prerelease="$(jq -r .isPrerelease existing-release.json)"
            if [[ "$is_draft" == "true" ]]; then
              # A previous upload may have stopped midway. Drafts are not
              # public or immutable, so remove that partial attempt and
              # recreate it from the newly verified complete asset set.
              gh release delete "$RELEASE_TAG" --yes
            else
              if [[ "$is_prerelease" == "true" ]]; then
                echo "existing $RELEASE_TAG is a prerelease; refusing to mutate it" >&2
                exit 1
              fi
              mkdir existing-assets
              gh release download "$RELEASE_TAG" --dir existing-assets
              expected_existing=(
                "SHA256SUMS"
                "zipp-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
                "zipp-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc.zip"
                "zipp-wasm-${{ needs.validate.outputs.version }}-web.zip"
                "zipp-wasm-${{ needs.validate.outputs.version }}-web-python.zip"
                "zipp-wasm-${{ needs.validate.outputs.version }}-web-python-base.zip"
                "zipp-wasm-${{ needs.validate.outputs.version }}-web-torch.zip"
              )
              mapfile -t actual_existing < <(
                find existing-assets -maxdepth 1 -type f -printf '%f\n' | sort
              )
              mapfile -t wanted_existing < <(
                printf '%s\n' "${expected_existing[@]}" | sort
              )
              if [[ "${actual_existing[*]}" != "${wanted_existing[*]}" ]]; then
                printf 'existing release has an unexpected asset set:\n%s\n' \
                  "${actual_existing[*]}" >&2
                exit 1
              fi
              (cd existing-assets && sha256sum --check SHA256SUMS)

              linux_bundle="zipp-$RELEASE_VERSION-x86_64-unknown-linux-gnu"
              windows_bundle="zipp-$RELEASE_VERSION-x86_64-pc-windows-msvc"
              linux_info="$(
                tar -xOf "existing-assets/$linux_bundle.tar.gz" \
                  "$linux_bundle/BUILD-INFO.json"
              )"
              windows_info="$(
                unzip -p "existing-assets/$windows_bundle.zip" \
                  "$windows_bundle/BUILD-INFO.json"
              )"
              for info in "$linux_info" "$windows_info"; do
                jq -e \
                  --arg version "$RELEASE_VERSION" \
                  --arg commit "$EXPECTED_COMMIT" \
                  '.name == "zipp" and .version == $version and
                   .commit == $commit and .dirty == false' \
                  <<< "$info" >/dev/null
              done
              for suffix in web web-python web-python-base; do
                wasm_bundle="zipp-wasm-$RELEASE_VERSION-$suffix"
                wasm_info="$(unzip -p "existing-assets/$wasm_bundle.zip" "$wasm_bundle/BUILD-INFO.txt")"
                grep -Fxq "version=$RELEASE_VERSION" <<< "$wasm_info"
                grep -Fxq "commit=$EXPECTED_COMMIT" <<< "$wasm_info"
                languages='["javascript"]'
                variant=javascript
                if [[ "$suffix" == web-python ]]; then
                  languages='["javascript","python"]'
                  variant=javascript-python
                elif [[ "$suffix" == web-python-base ]]; then
                  languages='["javascript","python"]'
                  variant=javascript-python-base
                fi
                grep -Fxq "variant=$variant" <<< "$wasm_info"
                grep -Fxq "languages=$languages" <<< "$wasm_info"
                unzip -p "existing-assets/$wasm_bundle.zip" "$wasm_bundle/PROFILE.json" \
                  | jq -e --arg version "$RELEASE_VERSION" --arg commit "$EXPECTED_COMMIT" \
                      --argjson languages "$languages" \
                      '.version == $version and .source.sha == $commit and .languages == $languages' >/dev/null
              done
              verify_remote_tag

              release_url="$(jq -r .url existing-release.json)"
              printf 'Existing [%s](%s) is complete and checksum-valid; no changes made.\n' \
                "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          notes_args=()
          notes_file="docs/releases/$RELEASE_VERSION.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "$RELEASE_TAG" dist/* "${notes_args[@]}" \
            --draft \
            --verify-tag \
            --target "$EXPECTED_COMMIT" \
            --title "ZIPP $RELEASE_TAG" \
            --generate-notes
          verify_remote_tag
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest \
            --target "$EXPECTED_COMMIT" \
            --verify-tag
          verify_remote_tag
          gh release view "$RELEASE_TAG" \
            --json isImmutable,url > published-release.json
          release_url="$(jq -r .url published-release.json)"
          immutable="$(jq -r .isImmutable published-release.json)"
          printf 'Published [%s](%s); immutable=%s\n' \
            "$RELEASE_TAG" "$release_url" "$immutable" >> "$GITHUB_STEP_SUMMARY"
