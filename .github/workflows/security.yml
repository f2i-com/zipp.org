name: Security

# The broad security matrix: dependency audits, the benchmark-harness
# adversarial tests, the safe-profile VM, the hostile-input and resource-limit
# regressions, the separately resolved native sandbox, and the WebAssembly
# sandbox boundary.
#
# It used to be manual-trigger only, so none of it ran unless someone
# remembered to (the 11 September 2026 audit's ZIPP-16). Now it runs every
# week against `main`, and on demand (`gh workflow run security.yml`). It is
# deliberately NOT on pull requests: CI (ci.yml) is the minimum gate, and the
# broad lanes — the full engine suite, the safe profile, the sandboxes, the
# browser Workers — are run locally before a push (HANDOFF.md, "Local
# verification") and here weekly as the safety net. Release publishing does
# not consume these results directly — release.yml requires the
# exact-revision CI gate — but a scheduled failure is visible on the Actions
# tab and blocks the next release review by policy.
#
# No job here publishes anything.
on:
  workflow_dispatch:
  schedule:
    # Mondays 03:17 UTC: off the hour, so it does not queue behind everyone
    # else's on-the-hour jobs.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  benchmark-integrity:
    name: Benchmark evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the Node.js harness-test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run benchmark harness adversarial tests
        run: |
          python -m unittest tools.test_bench tools.test_bench_hostile tools.test_bench_peak_rss
          node --no-warnings --test bench/comparison/test_run_wasm_suites.mjs

  native-workspace:
    name: Native workspace tests
    # The full native workspace is the expensive lane: weekly and on demand.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A deliberately labelled stable-toolchain canary: the pinned 1.92.0
      # toolchain is what CI and release use, so a failure here that CI does
      # not show is a toolchain drift signal, not a release blocker.
      - name: Select stable Rust (canary)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Validate and print the test quarantine
        run: python3 tools/ci_quarantine.py --check --print
      - name: Test the root native workspace
        run: |
          set -euo pipefail
          skips="$(python3 tools/ci_quarantine.py --emit-skips)"
          # shellcheck disable=SC2086
          cargo +stable test --locked --workspace --no-fail-fast -- $skips
      - name: Test bounded backtracking executor limits
        run: >-
          cargo +stable test --locked -p zipp-regress
          --features bounded-backtracking
          --test limited_backtracking

  safe-vm:
    name: Safe interpreter profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test the safe-profile VM library
        run: cargo +stable test --locked -p zipp-vm --no-default-features --features safe-sandbox --lib
      # The hostile-input and resource-limit regressions, plus the embedding
      # contracts the 11 September 2026 audit pinned (compile-free name calls
      # under a one-compile allowance; bounded fingerprint work), which the
      # safe profile's recorder can observe.
      - name: Test hostile-input, resource-limit and embedding-contract regressions
        run: |
          cargo +stable test --locked -p zipp-vm \
            --no-default-features --features safe-sandbox \
            --test clock_installed \
            --test instrument \
            --test intl_native_limits \
            --test native_iteration_limits \
            --test native_meta_recursion_limits \
            --test real_program_corpus \
            --test regex_execution_limits \
            --test regex_memory_limits \
            --test side_table_heap_limits \
            --test string_growth_limits \
            --test syntax_nesting_limits \
            --test json_plain_stringify \
            --test audit_20260911_native \
            --test audit_20260911_host_work \
            --test global_fingerprint

  native-sandbox:
    name: Isolated native sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Prove the hardened feature boundary
        run: |
          cargo +stable tree --locked --manifest-path crates/zipp-sandbox/Cargo.toml \
            -e features > sandbox-features.txt
          grep -q 'zipp-vm feature "safe-sandbox"' sandbox-features.txt
          grep -q 'mimalloc feature "secure"' sandbox-features.txt
          if grep -Eq 'zipp-vm feature "jit"|zipp-regress feature "rx-jit"|dynasm' \
              sandbox-features.txt; then
            echo "unsafe/JIT feature entered the hardened sandbox dependency graph" >&2
            exit 1
          fi
      - name: Test the separately resolved native sandbox
        run: cargo +stable test --locked --manifest-path crates/zipp-sandbox/Cargo.toml

  native-sandbox-windows:
    name: Isolated native sandbox (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test Windows supervision and path boundaries
        run: cargo +stable test --locked --manifest-path crates/zipp-sandbox/Cargo.toml

  wasm-sandbox:
    name: Isolated WebAssembly sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/zipp-wasm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust and wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup +stable target add wasm32-unknown-unknown
      - name: Select the Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test the isolated host build
        run: cargo +stable test --locked
      - name: Test artifact-only VM specializations
        run: >-
          cargo +stable test --locked --manifest-path ../zipp-vm/Cargo.toml
          --no-default-features
          --features safe-sandbox,meter-only,wasm-no-fs-loader,wasm-single-agent
          --test no_fs_loader --test wasm_single_agent
      - name: Install matching wasm-bindgen CLI
        run: cargo +stable install wasm-bindgen-cli --locked --version 0.2.126
      - name: Build the production wasm32 artifact
        env:
          RUSTFLAGS: >-
            -Dwarnings
            -C link-arg=--max-memory=1073741824
            -C link-arg=-zstack-size=1048576
          ZIPP_SOURCE_SHA: ${{ github.sha }}
        run: cargo +stable build --locked --release --target wasm32-unknown-unknown
      # The same list CI and release run; see tests/node/run-boundary-suite.cjs.
      - name: Test the production host boundary under Node
        run: |
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/run-boundary-suite.cjs
      # The exact stripped web package inside real Workers, through the
      # reference host adapter (ZIPP-17): weekly here, locally before a push.
      - name: Run the Worker smoke test in Chromium, Firefox and WebKit
        run: |
          set -euo pipefail
          wasm-bindgen --target web --out-dir tests/browser/pkg \
            --remove-name-section --remove-producers-section \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium firefox webkit
          node tests/browser/worker-smoke.mjs --browsers chromium,firefox,webkit

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2
      - name: Audit native workspace dependencies
        run: cargo +stable audit --deny warnings --file Cargo.lock
      - name: Audit isolated WebAssembly dependencies
        run: cargo +stable audit --deny warnings --file crates/zipp-wasm/Cargo.lock
      - name: Audit isolated native-sandbox dependencies
        run: cargo +stable audit --deny warnings --file crates/zipp-sandbox/Cargo.lock
      - name: Select Node.js for the landing-page lockfile audit
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Audit landing-page dependencies
        working-directory: landing
        run: npm audit --audit-level=low
