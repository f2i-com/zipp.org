name: Security

# The broad security matrix: dependency audits, the benchmark-harness
# adversarial tests, the safe-profile VM, the hostile-input and resource-limit
# regressions, the separately resolved native sandbox, and the WebAssembly
# sandbox boundary.
#
# Automatic CI is paused as of 2026-09-12. Run on demand with
# `gh workflow run security.yml`, which skips the two heavy lanes unless given
# `-f skip_heavy=false`; the former Monday 03:17 UTC schedule can be
# restored when automatic checks resume. CI (ci.yml) is the minimum gate, and the
# broad lanes — the full engine suite, the safe profile, the sandboxes, the
# browser Workers — are run locally before a push (HANDOFF.md, "Local
# verification") and here on demand. Release publishing calls this workflow
# at the validated tag commit and consumes every result.
#
# Every gating lane runs on the `toolchain` input, which defaults to the pinned
# release toolchain, so the suite that gates publishing is compiled by the same
# compiler as the artifacts it gates. `stable-canary` is the separate,
# non-blocking drift check; it does not run for a release gate.
#
# No job here publishes anything.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git revision to test (defaults to the dispatched revision)
        required: false
        type: string
      toolchain:
        description: Rust toolchain for every gating cargo lane
        required: false
        type: string
        default: "1.92.0"
      canary:
        description: Also run the non-blocking stable-toolchain canary
        required: false
        type: boolean
        default: true
      # On by default for a dispatch: the native workspace suite links 290-odd
      # test executables and takes about seventy minutes, Test262 about
      # fifteen, and the rest of the matrix about seven. A release always runs
      # both (release.yml passes this explicitly), and so does
      # `-f skip_heavy=false`.
      skip_heavy:
        description: Skip the native workspace suite (~70 min) and Test262 (~15 min); false runs the full matrix
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: Exact validated release commit
        required: true
        type: string
      toolchain:
        description: Rust toolchain for every gating cargo lane (the release toolchain)
        required: false
        type: string
        default: "1.92.0"
      skip_heavy:
        description: Skip the native workspace suite and Test262 (a dispatched docs-only retag; see release.yml)
        required: false
        type: boolean
        default: false
      canary:
        description: Run the stable-toolchain canary too (off for a release gate)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Key on the revision under test, not on the ref the run was started from.
  # Two release dispatches for different tags both resolve `github.ref` to
  # `refs/heads/main`, so a shared group let the second cancel the first and
  # silently skipped the first release's publish.
  group: security-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Every GATING cargo lane runs on this toolchain, which defaults to the
  # pinned release toolchain: release.yml builds the shipped native and WASM
  # artifacts with 1.92.0, so the suite that gates publishing must exercise the
  # compiler and LLVM that produced them. `stable` is a separate, non-blocking
  # canary job below. (dependency-audit stays on stable: cargo-audit is a tool,
  # and its findings do not depend on the compiler that builds the engine.)
  TOOLCHAIN: ${{ inputs.toolchain || '1.92.0' }}

jobs:
  benchmark-integrity:
    name: Benchmark evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the Node.js harness-test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run benchmark harness adversarial tests
        run: |
          python -m unittest tools.test_bench tools.test_bench_hostile tools.test_bench_peak_rss
          node --no-warnings --test bench/comparison/test_run_wasm_suites.mjs

  native-workspace:
    name: Native workspace tests
    if: ${{ !inputs.skip_heavy }}
    # The full native workspace is the expensive lane: on demand and at
    # release (there is no schedule while automatic CI is paused).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Hundreds of debug test executables otherwise duplicate full VM/parser
    # symbols and can exhaust the hosted runner during linking. Keep debug
    # assertions and optimization unchanged; omit only debugging metadata.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the gating Rust toolchain
        run: rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --no-self-update
      # Differential tests use Node 24 as their reference, including Float16Array.
      # The runner's preinstalled Node may omit it and produce fewer output rows.
      - name: Select the Node.js reference runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify reference runtime capabilities
        run: node -e 'if (Number(process.versions.node.split(".")[0]) !== 24 || typeof Float16Array !== "function") throw Error("Native parity tests require Node 24 with Float16Array"); console.log(process.version)'
      - name: Validate and print the test quarantine
        run: python3 tools/ci_quarantine.py --check --print
      - name: Test the root native workspace
        run: |
          set -euo pipefail
          skips="$(python3 tools/ci_quarantine.py --emit-skips)"
          # shellcheck disable=SC2086
          cargo +${{ env.TOOLCHAIN }} test --locked --workspace --no-fail-fast -- $skips
      - name: Test bounded backtracking executor limits
        run: >-
          cargo +${{ env.TOOLCHAIN }} test --locked -p zipp-regress
          --features bounded-backtracking
          --test limited_backtracking

  native-windows:
    name: Native CLI and JIT VM (Windows x86-64)
    # release.yml ships an x86_64-pc-windows-msvc CLI with the JIT on, but
    # every other native lane runs on ubuntu and the other Windows lane builds
    # zipp-sandbox, which excludes the JIT. Nothing therefore exercised the
    # Win64 calling convention, VirtualProtect code publication, or the
    # 256 MiB main-thread stack on the platform the binary runs on. This job
    # does, and release publishing depends on this workflow.
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the gating Rust toolchain
        run: rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --no-self-update
      - name: Select the Node.js reference runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # crates/zipp-cli/tests/windows_main_stack.rs is `#![cfg(windows)]`, so
      # this is the only lane that runs it; sandbox.rs also has cfg(windows)
      # cases, and audit_20260915_infra.rs pins the CLI's exit statuses.
      - name: Test the CLI, its Windows main-thread stack and the sandbox aliases
        run: cargo +${{ env.TOOLCHAIN }} test --locked -p zipp-cli
      - name: Test the JIT VM on the shipped Windows target
        run: >-
          cargo +${{ env.TOOLCHAIN }} test --locked -p zipp-vm --no-fail-fast
          --lib
          --test jit_tier_parity
          --test jit_tier_fuzz
          --test jit_global_own_prop
          --test jit_sparse_array_paths
          --test call_order_default
          --test class_body_bindings
          --test captured_intrinsic_lane

  safe-vm:
    name: Safe interpreter profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the gating Rust toolchain
        run: rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --no-self-update
      - name: Test the safe-profile VM library
        run: cargo +${{ env.TOOLCHAIN }} test --locked -p zipp-vm --no-default-features --features safe-sandbox --lib
      # The hostile-input and resource-limit regressions, plus the embedding
      # contracts the 11 September 2026 audit pinned (compile-free name calls
      # under a one-compile allowance; bounded fingerprint work), which the
      # safe profile's recorder can observe.
      - name: Test hostile-input, resource-limit and embedding-contract regressions
        run: |
          cargo +${{ env.TOOLCHAIN }} test --locked -p zipp-vm \
            --no-default-features --features safe-sandbox \
            --test clock_installed \
            --test instrument \
            --test intl_native_limits \
            --test native_iteration_limits \
            --test native_meta_recursion_limits \
            --test real_program_corpus \
            --test regex_execution_limits \
            --test regex_memory_limits \
            --test side_table_heap_limits \
            --test string_growth_limits \
            --test syntax_nesting_limits \
            --test json_plain_stringify \
            --test audit_20260911_native \
            --test audit_20260911_host_work \
            --test audit_20260912_buffer_reentrancy \
            --test audit_20260912_bytecode_metadata_width \
            --test audit_20260912_collection_clear_live \
            --test audit_20260912_decorator_gc_roots \
            --test audit_20260912_host_exceptions \
            --test audit_20260912_host_input_roots \
            --test audit_20260912_iterator_roots \
            --test audit_20260912_nested_proxy_roots \
            --test audit_20260912_parser_early_errors \
            --test audit_20260912_promise_capabilities \
            --test audit_20260912_strict_tonumber_bigint \
            --test audit_20260912_typedarray_species \
            --test audit_20260912_weak_gc \
            --test class_body_bindings --test annexb_arguments_bindings \
            --test intl_locale_fallback --test intl_german_datetime \
            --test intl_calendar_formatting --test global_fingerprint

  native-sandbox:
    name: Isolated native sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the gating Rust toolchain
        run: rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --no-self-update
      - name: Prove the hardened feature boundary
        run: |
          cargo +${{ env.TOOLCHAIN }} tree --locked --manifest-path crates/zipp-sandbox/Cargo.toml \
            -e features > sandbox-features.txt
          grep -q 'zipp-vm feature "safe-sandbox"' sandbox-features.txt
          grep -q 'mimalloc feature "secure"' sandbox-features.txt
          if grep -Eq 'zipp-vm feature "jit"|zipp-regress feature "rx-jit"|dynasm' \
              sandbox-features.txt; then
            echo "unsafe/JIT feature entered the hardened sandbox dependency graph" >&2
            exit 1
          fi
      - name: Test the separately resolved native sandbox
        run: cargo +${{ env.TOOLCHAIN }} test --locked --manifest-path crates/zipp-sandbox/Cargo.toml

  native-sandbox-windows:
    name: Isolated native sandbox (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the gating Rust toolchain
        run: rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --no-self-update
      - name: Test Windows supervision and path boundaries
        run: cargo +${{ env.TOOLCHAIN }} test --locked --manifest-path crates/zipp-sandbox/Cargo.toml

  wasm-sandbox:
    name: Isolated WebAssembly sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/zipp-wasm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select the gating Rust toolchain and wasm32 target
        run: |
          rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --no-self-update
          rustup +${{ env.TOOLCHAIN }} target add wasm32-unknown-unknown
      - name: Select the Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the isolated host build
        run: cargo +${{ env.TOOLCHAIN }} test --locked
      - name: Test artifact-only VM specializations
        run: >-
          cargo +${{ env.TOOLCHAIN }} test --locked --manifest-path ../zipp-vm/Cargo.toml
          --no-default-features
          --features safe-sandbox,meter-only,wasm-no-fs-loader,wasm-single-agent
          --test no_fs_loader --test wasm_single_agent
      - name: Install matching wasm-bindgen CLI
        run: cargo +${{ env.TOOLCHAIN }} install wasm-bindgen-cli --locked --version 0.2.126
      - name: Build the production wasm32 artifact
        env:
          RUSTFLAGS: >-
            -Dwarnings
            -C link-arg=--max-memory=1073741824
            -C link-arg=-zstack-size=1048576
          ZIPP_SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: cargo +${{ env.TOOLCHAIN }} build --locked --release --target wasm32-unknown-unknown
      # The same list CI and release run; see tests/node/run-boundary-suite.cjs.
      - name: Test the production host boundary under Node
        run: |
          wasm-bindgen --target nodejs --out-dir tests/node/pkg \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          node tests/node/run-boundary-suite.cjs
      # The exact stripped web package inside real Workers, through the
      # reference host adapter (ZIPP-17): here on demand and at release,
      # locally before a push.
      - name: Run the Worker smoke test in Chromium, Firefox and WebKit
        run: |
          set -euo pipefail
          wasm-bindgen --target web --out-dir tests/browser/pkg \
            --remove-name-section --remove-producers-section \
            target/wasm32-unknown-unknown/release/zipp_wasm.wasm
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium firefox webkit
          node tests/browser/worker-smoke.mjs --browsers chromium,firefox,webkit

  test262:
    name: Pinned Test262 conformance
    if: ${{ !inputs.skip_heavy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check out the pinned Test262 corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tc39/test262
          ref: 4249661388e5d3f92a85186213da140a6481490f
          # Keep the external corpus out of the engine's source-identity scan.
          path: target/test262
          persist-credentials: false
      - name: Select the pinned release Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --no-self-update
      - name: Build the locked release CLI
        run: cargo +1.92.0 build --locked --release --package zipp-cli --bin zipp
      - name: Verify the CLI records the clean checked-out source
        run: |
          python3 - <<'PY'
          import json, subprocess
          info = json.loads(subprocess.check_output(["target/release/zipp", "--version", "--json"]))
          expected = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert info["source"] == expected and info["dirty"] is False, info
          print("Test262 engine source:", expected)
          PY
      - name: Test conformance scoring and corpus provenance checks
        run: python3 -m unittest discover -s tools -p 'test_run_test262*.py'
      - name: Report upstream and require all documented corrected tests to pass
        run: >-
          python3 tools/run_test262_dual.py
          --t262 target/test262
          --corrected-tree target/test262-corrected
          --zipp target/release/zipp
          --jobs 2 --timeout 120
          --output-dir target/test262-evidence
      - name: Require the original DateTimeFormat ECMA-402 tests to pass
        run: >-
          python3 tools/run_test262.py --t262 target/test262
          --sub test/intl402/DateTimeFormat --include-intl402
          --zipp target/release/zipp --jobs 2 --timeout 120
          --dump-fails target/test262-evidence/datetimeformat-failures.txt
          --json target/test262-evidence/datetimeformat.json
      - name: Upload the conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test262-evidence
          path: target/test262-evidence/
          if-no-files-found: warn
          retention-days: 30

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2
      - name: Audit native workspace dependencies
        run: cargo +stable audit --deny warnings --file Cargo.lock
      - name: Audit isolated WebAssembly dependencies
        run: cargo +stable audit --deny warnings --file crates/zipp-wasm/Cargo.lock
      - name: Audit isolated native-sandbox dependencies
        run: cargo +stable audit --deny warnings --file crates/zipp-sandbox/Cargo.lock
      - name: Select Node.js for the landing-page lockfile audit
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Audit landing-page dependencies
        working-directory: landing
        run: npm audit --audit-level=low

  stable-canary:
    name: Stable-toolchain canary (non-blocking)
    # Toolchain drift only. The gating lanes above run on the toolchain that
    # builds the shipped binaries; this one re-runs the full native workspace
    # on whatever `stable` is today, so a future-incompat error, lint or
    # behaviour change shows up before the pin moves. It must never hold a
    # release: `workflow_call` defaults `canary` to false so a release gate
    # does not run it at all, and `continue-on-error` keeps a failure here out
    # of the workflow's result even when it is dispatched by hand.
    if: ${{ inputs.canary }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select the Node.js reference runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the root native workspace on stable
        run: |
          set -euo pipefail
          skips="$(python3 tools/ci_quarantine.py --emit-skips)"
          # shellcheck disable=SC2086
          cargo +stable test --locked --workspace --no-fail-fast -- $skips
