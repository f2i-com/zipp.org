version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wasmtime stays on its long-term-support line, and wasmparser on the
    # version that line uses (see crates/zipp-vm/Cargo.toml). Patch releases
    # of the line, which carry its security fixes, still arrive.
    ignore:
      - dependency-name: "wasmtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "wasmparser"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # zipp-wasm is deliberately a separate Cargo workspace and has its own lock.
  - package-ecosystem: cargo
    directory: "/crates/zipp-wasm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The native sandbox is also a deliberately separate Cargo workspace/lock.
  - package-ecosystem: cargo
    directory: "/crates/zipp-sandbox"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/landing"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React and its renderer/types must be reviewed as one compatible set.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    # wrangler comes with @cloudflare/vite-plugin, which depends on one exact
    # version of it. Raised by itself it is installed a second time, with its
    # own miniflare and workerd, beside the copy the plugin runs. It moves
    # when the plugin does.
    ignore:
      - dependency-name: "wrangler"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
