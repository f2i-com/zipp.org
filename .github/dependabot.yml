version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # zipp-wasm is deliberately a separate Cargo workspace and has its own lock.
  - package-ecosystem: cargo
    directory: "/crates/zipp-wasm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The native sandbox is also a deliberately separate Cargo workspace/lock.
  - package-ecosystem: cargo
    directory: "/crates/zipp-sandbox"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/landing"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
