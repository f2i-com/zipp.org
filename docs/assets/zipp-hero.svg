<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ZIPP — Zippy Interpreter for Polyglot Programming. A portable polyglot runtime.</title>
  <desc id="desc">A dark violet banner with a lightning mark, the ZIPP name, "Portable Polyglot Runtime", "Zippy Interpreter for Polyglot Programming", and badges for JavaScript, Python, WebAssembly, Windows and Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#24124d"/>
      <stop offset="1" stop-color="#083b4c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="30" fill="url(#bg)"/>
  <g transform="translate(0 -30)">
  <g opacity="0.18" stroke="#a78bfa" stroke-width="2">
    <path d="M0 67h270M0 105h215M0 143h160"/>
    <path d="M930 217h270M985 255h215M1040 293h160"/>
  </g>
  <circle cx="225" cy="180" r="108" fill="#7c3aed" opacity="0.14" filter="url(#glow)"/>
  <circle cx="225" cy="180" r="91" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M92 0 0 122h58l-25 86L142 69h-62z" transform="translate(154 76)" fill="url(#bolt)" filter="url(#glow)"/>
  <text x="370" y="176" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="108" font-weight="750" letter-spacing="-3">ZIPP</text>
  <text x="640" y="150" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-0.5">Portable Polyglot Runtime</text>
  <text x="376" y="228" fill="#d8d4fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" letter-spacing="0.6">ZIPPY INTERPRETER FOR POLYGLOT PROGRAMMING</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">
    <rect x="376" y="260" width="150" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="397" y="287" fill="#ede9fe">JavaScript</text>
    <rect x="540" y="260" width="112" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="561" y="287" fill="#ede9fe">Python</text>
    <rect x="666" y="260" width="182" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="687" y="287" fill="#cffafe">WebAssembly</text>
    <rect x="862" y="260" width="128" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="883" y="287" fill="#cffafe">Windows</text>
    <rect x="1004" y="260" width="96" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
    <text x="1025" y="287" fill="#cffafe">Linux</text>
  </g>
  </g>
</svg>
