# zipp — a clean-sheet JavaScript engine.
#
# `crates/zipp-vm` is the project: a NaN-boxed, explicit-frame register VM with
# per-call-site inline caches and a native x86-64 OSR JIT. `zipp-cli` is a thin
# `zipp js <file.js>` front end over it, and `regress-fork` is the ECMAScript
# regex engine it depends on.
#
# The workspace previously carried a separate ahead-of-time language (`zippc`
# plus Cranelift/LLVM/WASM/zk back ends and a TypeScript frontend). That effort
# predates the engine and the objective moved; those crates were removed rather
# than left to rot alongside code they no longer share anything with.
[workspace]
resolver = "2"
members = [
    "crates/zipp-vm",      # the JavaScript engine: register VM + native x86-64 OSR JIT
    "crates/zipp-cli",     # `zipp js file.js` / `zipp mjs file.mjs`
    "crates/zipp-wasm",    # wasm-bindgen embedding: a persistent VM for browser hosts
    "crates/regress-fork", # our fork of regress 0.11.1 — the regex engine (see its FORK.md)
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

# Shared dependency versions referenced via `.workspace = true` (one resolved
# copy each). `rustc-hash` is the engine's fast hasher; `dynasm`/`dynasmrt` back
# its optional native x86-64 JIT.
[workspace.dependencies]
rustc-hash = "2"
dynasm = "2.0"
dynasmrt = "2.0"

[profile.release]
opt-level = 3
# MEASURED 2026-07-26: fat LTO + a single codegen unit is worth ~2% geomean
# across the real suite (2.80x -> 2.77x), for ~45s more build time. Cross-crate
# inlining matters here because the hot path spans zipp-vm, the regress fork and
# mimalloc.
#
# NOT set: `target-cpu=native`, which measures faster still but produces a binary
# that will not run on an older machine — wrong default for a shipped engine.
# Benchmark it locally with RUSTFLAGS if you want the number.
lto = "fat"
codegen-units = 1
# Panics are internal bugs, never normal control flow (JS errors propagate as
# `Result`/`Thrown`). Aborting lets the JIT's per-self-call `catch_unwind` at the
# native↔Rust boundary compile to ~nothing (no landing pads on the hot recursive
# path), which speeds up deep recursion.
panic = "abort"
